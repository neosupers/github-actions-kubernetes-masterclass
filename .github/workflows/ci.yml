name: CI

on:
  push:
    branches: [main]

jobs:
  Build-Image:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - name: Download Code
        uses: actions/checkout@v4

      - name: Download Image
        uses: docker/setup-buildx-action@v4

      # Login + push only happen when DEPLOY_ENABLED=true.
      # Otherwise the job builds the images locally to validate the
      # Dockerfiles and exits green — a "dry run."
  Push_Image:
    on:
      workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]
    runs-on: self-hosted          
    steps:
      - name: Build & Push Images
        uses: docker/login-action@v4
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/rahul-backend:latest', secrets.DOCKERHUB_USERNAME) || 'rahul-backend:latest' }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/rahul-frontend:latest', secrets.DOCKERHUB_USERNAME) || 'rahul-frontend:latest' }}